name: Sync to Hugging Face Hub

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is missing!"
            exit 1
          fi

          HF_USERNAME="ahmed-fouad-lagha"
          HF_SPACE_NAME="IoT-Access-Sentinel"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Create a clean orphan deployment snapshot
          git branch -D hf-deploy 2>/dev/null || true
          git checkout --orphan hf-deploy
          git rm -rf assets/ 2>/dev/null || true

          # Inject Hugging Face Space metadata into README.md
          # NOTE: Using printf instead of heredoc to avoid '---' at column 0
          # which YAML parsers interpret as a document separator, silently
          # truncating the run script.
          printf '%s\n' \
            '---' \
            'title: IoT Access Sentinel' \
            'emoji: 🛡️' \
            'colorFrom: blue' \
            'colorTo: indigo' \
            'sdk: gradio' \
            'sdk_version: 6.29.1' \
            'app_file: app.py' \
            'pinned: false' \
            '---' \
            '' > /tmp/hf_header.txt

          cat /tmp/hf_header.txt README.md > /tmp/README_HF.md
          mv /tmp/README_HF.md README.md

          git add -A
          git commit -m "deploy: sync $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "Pushing to https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" hf-deploy:main
          echo "Done."
